spring.application.name=movie.reservation

spring.datasource.url=jdbc:postgresql://localhost:5432/movie_reservation
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT
jwt.secret.key=Ym9sZC1hbmQtYnJhc2gtc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9uLXByb2plY3QK

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=movie-monitoring-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.project.movie.reservation.entity,com.project.movie.reservation.dto

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always